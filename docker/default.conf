#
# The server that hands out the front end, as a drop-in that replaces the
# base image's /etc/nginx/conf.d/default.conf.
#
# Port 8099 is what the Home Assistant App's config.yaml points ingress
# at. The port is not published to the host, so the Supervisor is the
# only thing that can reach it and the server needs no access rules of
# its own.
#
# Ingress strips its own path prefix before it proxies, and every URL in
# the distribution is relative, so nothing here has to know about a base
# path.
#
# `.wasm` is served as `application/wasm` without anything being declared
# here: the base image's /etc/nginx/mime.types already maps it, and the
# main configuration includes that file.

server {
    listen 8099;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
}
