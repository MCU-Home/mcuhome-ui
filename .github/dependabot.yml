#
# Every action in .github/workflows is pinned to a full commit SHA; the
# github-actions entry below is what keeps those pins current.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The base image of docker/Dockerfile is pinned to an exact nginx
  # version; this entry is what keeps that pin current.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  # The root pyproject.toml holds only the linter pins
  # ([dependency-groups] dev), no project of its own.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
