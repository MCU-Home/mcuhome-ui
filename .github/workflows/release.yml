#
# Publish the dashboard's container image.
#
#   ghcr.io/mcu-home/ui-homeassistant-app   the Home Assistant App
#
# Triggered by a `v*` tag, and the tag is the version: `v0.1.0` publishes
# `:0.1.0`. Home Assistant pulls the App image by the tag named in the app
# repository's config.yaml, so a release is finished by bumping `version:`
# there — see mcu-home/homeassistant-apps. Doing it the other way round
# offers users an update that cannot be pulled.
#
# One image name, multi-architecture underneath: amd64 and aarch64, the
# two architectures Home Assistant ships for. The image carries no
# toolchain — the front end is built here, on the runner, by the same
# steps as the build gate in ci-build.yml, and the image build only
# copies the result. That is also why nothing is cached: there is no
# compilation in the Docker build to cache.
#
# All actions are pinned to commit SHAs, not tags (see dependabot.yml).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version}"

      - name: Set up the JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-root-directory: frontend
          # Dependency-graph submission writes to the repository's
          # dependency graph; this workflow only reads.
          dependency-graph: disabled

      - name: Build the distribution
        working-directory: frontend
        run: ./gradlew --console=plain :web:wasmJsBrowserDistribution

      - name: Set up QEMU
        # The runner is amd64; the aarch64 leg is emulated. Nothing is
        # compiled in the image build, so the emulation only copies
        # files.
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the Home Assistant image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # No `latest` here on purpose: the Supervisor pulls the exact
          # tag the app's config.yaml names, and a moving tag beside it
          # is only ever something to pull by mistake.
          tags: ghcr.io/mcu-home/ui-homeassistant-app:${{ steps.version.outputs.version }}
